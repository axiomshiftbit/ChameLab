name: GUI build

on:
  workflow_call:
    inputs:
      sign-android:
        description: Sign Android release APKs (version tags only)
        required: false
        type: boolean
        default: false
      build-ios:
        description: Include iOS builds when validating all supported platforms
        required: false
        type: boolean
        default: true
      checkout-sha:
        required: false
        type: string
    outputs:
      version:
        description: The app version, e.g. 1.0.7, or 1.0.7-dev.N with N commits after the release
        value: ${{ jobs.version.outputs.version }}

jobs:
  version:
    name: Work out the GUI version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        run: |
          base=$(tr -d '\r\n' < software/chamelab/VERSION)
          [[ $base =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || exit 1
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          bump=$(git log -1 --format=%H -- software/chamelab/VERSION)
          commits=$(git rev-list --count "$bump..HEAD")
          version=$base
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            [[ $GITHUB_REF == refs/tags/v$base ]] || { echo 'Release tag must match software/chamelab/VERSION'; exit 1; }
            commits=0
          else
            version=$base-dev.$commits
          fi
          (( commits > 99 )) && commits=99
          code=$(( major * 1000000 + minor * 10000 + patch * 100 + commits ))
          (( major < 2 )) && code=$(( code + 10000000 ))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test_managed_hardnested:
    name: Managed hardnested (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify recovery and scalar/SIMD equivalence
        run: dotnet test software/chamelab/ChameLab.Tests -c Release --filter FullyQualifiedName~Hardnested

  build_desktop:
    name: Build GUI (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: [version, test_managed_hardnested]
    permissions:
      contents: read
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: >
          dotnet publish software/chamelab/ChameLab.Desktop/ChameLab.Desktop.csproj
          -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ needs.version.outputs.version }}
          -o publish
      - name: Zip up GUI for release
        # The assembly can't be called ChameLab (that's the shared library), so only the
        # single-file executable is renamed
        run: |
          for f in publish/ChameLab.Desktop publish/ChameLab.Desktop.exe; do
            [[ -e $f ]] && mv "$f" "${f/ChameLab.Desktop/ChameLab}"
          done
          if [[ '${{ matrix.rid }}' == osx-* ]]; then
            dotnet run --project software/chamelab/ChameLab.Tools -c Release -- mac-bundle publish '${{ needs.version.outputs.version }}'
          fi
          (cd publish && zip -r "$OLDPWD/chamelab-${{ matrix.rid }}.zip" . -x '*.pdb')
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-${{ matrix.rid }}
          path: chamelab-${{ matrix.rid }}.zip

  build_browser:
    name: Build GUI (browser)
    runs-on: ubuntu-latest
    needs: [version, test_managed_hardnested]
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install the WebAssembly workload
        # Links SkiaSharp's native assets into the WASM output
        run: dotnet workload install wasm-tools
      - name: Publish
        run: >
          dotnet publish software/chamelab/ChameLab.Browser/ChameLab.Browser.csproj
          -c Release
          -p:Version=${{ needs.version.outputs.version }}
          -o publish
      - name: Verify managed hardnested in a browser worker
        run: |
          npm install --prefix "$RUNNER_TEMP/hardnested-browser-tests" playwright
          "$RUNNER_TEMP/hardnested-browser-tests/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/hardnested-browser-tests/node_modules" node software/chamelab/ChameLab.Browser/tests/browser-worker.cjs publish/wwwroot software/chamelab/ChameLab.Tests/Reference/hardnested_capture.txt
      - name: Package the web app
        # Released with the other files; the website serves the stable and the development one
        run: (cd publish/wwwroot && zip -qr "$OLDPWD/chamelab-web.zip" .)
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-browser
          path: chamelab-web.zip

  build_android:
    if: ${{ !inputs.sign-android }}
    name: Build GUI (android)
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Publish development APKs without release credentials
        run: |
          for rid in android-arm64 android-arm; do
            dotnet publish software/chamelab/ChameLab.Android/ChameLab.Android.csproj \
              -c Release -f net10.0-android -r "$rid" \
              -p:ApplicationId=io.github.axiomshiftbit.chamelab.dev \
              -p:Version=${{ needs.version.outputs.version }} \
              -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }} \
              -p:ApplicationVersion=${{ needs.version.outputs.code }} -o "publish/$rid"
            cp publish/"$rid"/*-Signed.apk "chamelab-$rid-development.apk"
          done
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-android
          path: chamelab-android-*.apk

  build_android_release:
    if: ${{ inputs.sign-android && startsWith(github.ref, 'refs/tags/v') }}
    environment: release
    name: Sign GUI release (android)
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android workload
        run: dotnet workload install android
      - name: Prepare the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo '::error::Release signing requires a version tag'; exit 1; }
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing release signing secret: $name"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/chamelab-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/chamelab-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/chamelab-signing/release.p12"
      - name: Publish release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for rid in android-arm64 android-arm; do
            dotnet publish software/chamelab/ChameLab.Android/ChameLab.Android.csproj \
              -c Release -f net10.0-android -r "$rid" \
              -p:Version=${{ needs.version.outputs.version }} \
              -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }} \
              -p:ApplicationVersion=${{ needs.version.outputs.code }} \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/chamelab-signing/release.p12" \
              -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
              -p:AndroidSigningKeyPass=env:KEY_PASSWORD \
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD -o "publish/$rid"
            cp publish/"$rid"/*-Signed.apk "chamelab-$rid.apk"
          done
      - name: Delete temporary signing material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/chamelab-signing/release.p12"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-gui-android
          path: chamelab-android-*.apk

  build_ios:
    if: ${{ inputs.build-ios }}
    name: Build GUI (iOS, ${{ matrix.rid }})
    runs-on: macos-26
    needs: version
    # Keep the Apple toolchain and workload set together. Installing the latest
    # iOS workload can require an Xcode not yet available on hosted runners.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_DOTNET_VERSION: '10.0.302'
      IOS_WORKLOAD_VERSION: '10.0.302.0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rid: [ios-arm64, iossimulator-arm64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-sha == null && github.sha || inputs.checkout-sha }}
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.IOS_DOTNET_VERSION }}
      - name: Select the pinned .NET SDK and Xcode
        run: |
          dotnet new globaljson --sdk-version "$IOS_DOTNET_VERSION" --roll-forward disable
          dotnet --version
          xcodebuild -version
      - name: Install the iOS workload
        run: dotnet workload install ios --version "$IOS_WORKLOAD_VERSION"
      - name: Build the app with the managed hardnested engine
        run: >
          dotnet build software/chamelab/ChameLab.iOS/ChameLab.iOS.csproj
          -c Release -r ${{ matrix.rid }}
          -p:Version=${{ needs.version.outputs.version }}
          -p:EnableCodeSigning=false
      - name: Upload the unsigned app
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.rid }}-unsigned
          path: software/chamelab/ChameLab.iOS/bin/Release/net10.0-ios/${{ matrix.rid }}/*.app
